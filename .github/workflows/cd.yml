name: cd

on:
    push:
        branches: [main]

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
        - name: checkout the code
          uses: actions/checkout@v6
        
        - name: install go toolchain
          uses: actions/setup-go@v6
          with:
            go-version: "1.27.1"

        - name: runs the build script
          run: ./scripts/buildprod.sh

        
        

